name: Comic Lore Vault - Autonomous Cloud Video Engine

on:
  workflow_dispatch:
    inputs:
      story_id:
        description: 'Comic Arc ID (or "any" for automatic queue)'
        required: false
        default: 'any'
        type: choice
        options:
          - any
          - under_the_red_hood
          - death_of_superman
          - infinity_gauntlet
      mode:
        description: 'Execution Mode (Safe verification vs Official Live)'
        required: true
        default: 'render_only'
        type: choice
        options:
          - render_only
          - draft_only
          - live_release
          - dry_run

  schedule:
    # Daily automated live release at 15:00 UTC (10:00 AM EST)
    - cron: '0 15 * * *'

jobs:
  produce-and-publish:
    name: Generate & Publish Comic Reel
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-liberation fonts-dejavu

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Cloud Generation & Publishing
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          EVENT_MODE: ${{ github.event.inputs.mode || 'live_release' }}
        run: |
          ARGS=""
          MODE="${EVENT_MODE}"

          echo "Selected Execution Mode: $MODE"

          if [ "$MODE" = "dry_run" ]; then
            ARGS="$ARGS --dry-run"
          elif [ "$MODE" = "draft_only" ]; then
            ARGS="$ARGS --publish --draft"
          elif [ "$MODE" = "live_release" ]; then
            ARGS="$ARGS --publish"
          elif [ "$MODE" = "render_only" ]; then
            echo "Render Only mode: Video will be rendered and saved as artifact without posting to any platform."
          fi

          if [ -n "${{ github.event.inputs.story_id }}" ] && [ "${{ github.event.inputs.story_id }}" != "any" ]; then
            ARGS="$ARGS --story-id ${{ github.event.inputs.story_id }}"
          fi

          python -m src.cloud_runner $ARGS

      - name: Upload Final Video Artifact (For Safe Download & Review)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comic-lore-video-${{ github.run_number }}
          path: output/**/*.mp4
          if-no-files-found: ignore

      - name: Archive Production Logs & Manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comic-lore-production-logs-${{ github.run_number }}
          path: |
            output/videos_log.csv
            output/**/*.ass
            output/**/script.json
          if-no-files-found: ignore
