name: Comic Lore Vault - Autonomous Cloud Video Engine

on:
  workflow_dispatch:
    inputs:
      story_id:
        description: 'Comic Arc ID (or "any" for automatic non-repeating queue)'
        required: false
        default: 'any'
        type: choice
        options:
          - any
          - batman_under_the_red_hood
          - batman_court_of_owls
          - flashpoint_thomas_wayne
          - joker_killing_joke
          - injustice_superman_fall
          - green_lantern_blackest_night
          - thor_god_butcher
          - daredevil_born_again
          - civil_war_death_of_cap
          - secret_wars_god_emperor_doom
          - wolverine_old_man_logan
          - venom_maximum_carnage
      mode:
        description: 'Execution Mode (Safe verification vs Official Live)'
        required: true
        default: 'render_only'
        type: choice
        options:
          - render_only
          - draft_only
          - live_release
          - dry_run

  # schedule:
  #   # Deactivated - initial 10 videos will be triggered manually.
  #   # External cronjob or scheduled API dispatch will be activated later.
  #   # - cron: '0 15 * * *'

permissions:
  contents: write

jobs:
  produce-and-publish:
    name: Generate & Publish Comic Reel
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-liberation fonts-dejavu

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Cloud Generation & Publishing
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          EVENT_MODE: ${{ github.event.inputs.mode || 'live_release' }}
        run: |
          ARGS=""
          MODE="${EVENT_MODE}"

          echo "Selected Execution Mode: $MODE"

          if [ "$MODE" = "dry_run" ]; then
            ARGS="$ARGS --dry-run"
          elif [ "$MODE" = "draft_only" ]; then
            ARGS="$ARGS --publish --draft"
          elif [ "$MODE" = "live_release" ]; then
            ARGS="$ARGS --publish"
          elif [ "$MODE" = "render_only" ]; then
            echo "Render Only mode: Video will be rendered and saved as artifact without posting to any platform."
          fi

          if [ -n "${{ github.event.inputs.story_id }}" ] && [ "${{ github.event.inputs.story_id }}" != "any" ]; then
            ARGS="$ARGS --story-id ${{ github.event.inputs.story_id }}"
          fi

          python -m src.cloud_runner $ARGS

      - name: Commit & Push Production Ledger (Zero-Duplicate Persistence)
        if: success()
        run: |
          git config user.name "ComicLoreVault Engine"
          git config user.email "Lorecomicvault@users.noreply.github.com"
          git add published_ledger.json output/videos_log.csv 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(ledger): record produced comic video to prevent duplicate [skip ci]"
            git push origin main
          else
            echo "Ledger up to date. No new entries to commit."
          fi

      - name: Upload Final Video Artifact (For Safe Download & Review)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comic-lore-video-${{ github.run_number }}
          path: output/**/*.mp4
          if-no-files-found: ignore

      - name: Archive Production Logs & Manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comic-lore-production-logs-${{ github.run_number }}
          path: |
            output/videos_log.csv
            output/**/*.ass
            output/**/script.json
            published_ledger.json
          if-no-files-found: ignore
