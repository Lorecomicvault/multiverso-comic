name: Comic Lore Vault - Motor Autonomo de Videos en Espanol

on:
  workflow_dispatch:
    inputs:
      story_id:
        description: 'ID del Arco de Comic (o "any" para cola automatica anti-duplicados)'
        required: false
        default: 'any'
        type: choice
        options:
          - any
          - knull_dios_simbiontes
          - batman_que_rie
          - injustice_regimen_superman
          - gorr_carnicero_dioses
          - world_war_hulk_coloso
          - civil_war_caida_heroes
          - blackest_night_rebelion
          - secret_wars_dios_doom
          - flashpoint_paradoja
          - killing_joke_broma_asesina
          - red_hood_capucha_roja
          - franklin_richards_creador
          - thanos_wins_fin_existencia
          - dark_nights_metal
          - muerte_superman
          - old_man_logan
          - muerte_gwen_stacy
          - superboy_prime
          - torre_de_babel
          - cosmic_ghost_rider
          - crisis_tierras_infinitas
          - marvel_zombies
          - robo_del_mysterium
          - batman_corte_de_los_buhos
      mode:
        description: 'Modo de Ejecucion (render_only vs live_release)'
        required: true
        default: 'render_only'
        type: choice
        options:
          - render_only
          - live_release
          - draft_only
          - dry_run

  # schedule:
  #   # Desactivado - los videos iniciales se disparan manualmente via workflow_dispatch.
  #   # - cron: '0 16 * * *'

permissions:
  contents: write

jobs:
  produce-and-publish:
    name: Generar y Publicar Reel en Espanol
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Codigo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependencias del Sistema (FFmpeg y Fuentes)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-liberation fonts-dejavu

      - name: Instalar Dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Generacion y Publicacion en la Nube
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN || 'EAAduw9ZBIaysBSVYGkNZCmRYBKHwiPpwlkZBiFxM5SNCWCBnmMLhl7SDSvUNFJXzn6xSYQBeKDNseZA3bM5cwCxcIV7L4bim7nlIU5CtgsB8gZCy82iew2MZB72Q13ODT8yBKcFrdRHXhUziR7DwOqMCoZBOcTd4whcwZByMWR4xQfqWJEl7gHZCRT3HOtZA73OMBCaZCzi' }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID || '1289410784257454' }}
          IG_USER_ID: ${{ secrets.IG_USER_ID || '17841427017671758' }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY || 'AIzaSyDpdDhoXt8GDwJ_sEj-vjtd6HqVflN_vSY' }}
          VOICE: 'es-US-Studio-B'
          EVENT_MODE: ${{ github.event.inputs.mode || 'render_only' }}
        run: |
          ARGS=""
          MODE="${EVENT_MODE}"

          echo "Modo de Ejecucion Seleccionado: $MODE"

          if [ "$MODE" = "dry_run" ]; then
            ARGS="$ARGS --dry-run"
          elif [ "$MODE" = "draft_only" ]; then
            ARGS="$ARGS --publish --draft"
          elif [ "$MODE" = "live_release" ]; then
            ARGS="$ARGS --publish"
          elif [ "$MODE" = "render_only" ]; then
            echo "Modo Render Only: El video se renderizara y guardara como artefacto sin publicar en Meta."
          fi

          if [ -n "${{ github.event.inputs.story_id }}" ] && [ "${{ github.event.inputs.story_id }}" != "any" ]; then
            ARGS="$ARGS --story-id ${{ github.event.inputs.story_id }}"
          fi

          python -m src.cloud_runner $ARGS

      - name: Persistir Ledger de Produccion (Cero Duplicados)
        if: success()
        run: |
          git config user.name "ComicLoreVault Engine"
          git config user.email "Lorecomicvault@users.noreply.github.com"
          git add published_ledger.json output/videos_log.csv 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(ledger): registrar video producido para prevenir duplicados [skip ci]"
            git push origin main
          else
            echo "Ledger al dia. No hay nuevas entradas para commitear."
          fi

      - name: Subir Video Final como Artefacto (Descarga y Revision)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comic-lore-spanish-video-${{ github.run_number }}
          path: output/**/*.mp4
          if-no-files-found: ignore

      - name: Archivar Logs de Produccion y Manifiesto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comic-lore-spanish-production-logs-${{ github.run_number }}
          path: |
            output/videos_log.csv
            output/**/*.ass
            output/**/script.json
            published_ledger.json
          if-no-files-found: ignore
