name: Multiverso Comic - Motor Autonomo de Videos

on:
  workflow_dispatch:
    inputs:
      story_id:
        description: 'ID del Arco de Comic (o "autonomous_ai" para generacion infinita)'
        required: false
        default: 'autonomous_ai'
        type: choice
        options:
          - batman_zur_en_arrh_respaldo
          - superior_iron_man_extremis_villano
          - doctor_strange_el_juramento_elixir
          - superman_vs_the_elite_action_775
          - spiderman_grim_hunt_venganza_kravinoff
          - flash_the_human_race_teleportation
          - batman_white_knight_joker_cuerdo
          - autonomous_ai
          - any
          - punisher_jigsaw_desfiguracion_billy_russo
          - thanos_rising_el_origen_del_titan_loco
          - xmen_dias_del_futuro_pasado_centinelas
          - vengadores_desunidos_la_locura_de_wanda
          - daredevil_el_hombre_sin_miedo_origen_quimico
          - aquaman_mano_arpon_charybdis
          - green_lantern_kyle_rayner_major_force
          - doctor_strange_dormammu_bucle_dimension_oscura
          - captain_america_el_soldado_del_invierno
          - sinestro_corps_war
          - deadpool_kills_marvel_universe
          - kingdom_come_justicia_divina
          - all_star_superman_morrison
          - magneto_testamento_origen
          - daredevil_born_again
          - wolverine_arma_x
          - punisher_born_vietnam
          - thor_ragnarok_crepusculo
          - knightfall_la_caida_del_murcielago
          - moon_knight_khonshu_locura
          - silver_surfer_requiem
          - maximum_carnage_matanza
          - doctor_strange_el_juramento
          - green_lantern_crepusculo_esmeralda
          - kravens_last_hunt_spider_man
          - invincible_omni_man_conquista
          - soldado_del_invierno_resurreccion
          - batman_endgame_joker_final
          - spawn_malebolgia_guerra
          - guerra_de_bromas_y_acertijos
          - infinity_gauntlet_original_thanos
          - batman_tribunal_de_los_buhos_laberinto
          - thanos_rising_el_origen_del_titan_loco
          - flash_godspeed_el_ladron_de_velocidad
          - marvel_ruins_el_universo_maldito
          - superior_iron_man_extremis
          - daredevil_born_again_kingpin
      mode:
        description: 'Modo de Ejecucion (render_only vs live_release)'
        required: true
        default: 'live_release'
        type: choice
        options:
          - live_release
          - render_only
          - draft_only
          - dry_run

  # Programacion externa: Controlado 100% via webhooks desde cron-job.org para precision de horario.

permissions:
  contents: write

jobs:
  produce-and-publish:
    name: Generar y Publicar Reel en Espanol
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Codigo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependencias del Sistema (FFmpeg y Fuentes)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-liberation fonts-dejavu fonts-noto-color-emoji fontconfig
          mkdir -p ~/.local/share/fonts
          cp fonts/*.ttf ~/.local/share/fonts/ 2>/dev/null || true
          cp assets/fonts/*.ttf ~/.local/share/fonts/ 2>/dev/null || true
          fc-cache -f -v

      - name: Instalar Dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configurar Node.js para Remotion
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar y Verificar Motor Remotion
        run: |
          cd remotion
          npm install
          npx --yes remotion browser ensure
          npx --yes remotion compositions src/Root.tsx

      - name: Ejecutar Generacion y Publicacion en la Nube
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN || 'EAAduw9ZBIaysBSVYGkNZCmRYBKHwiPpwlkZBiFxM5SNCWCBnmMLhl7SDSvUNFJXzn6xSYQBeKDNseZA3bM5cwCxcIV7L4bim7nlIU5CtgsB8gZCy82iew2MZB72Q13ODT8yBKcFrdRHXhUziR7DwOqMCoZBOcTd4whcwZByMWR4xQfqWJEl7gHZCRT3HOtZA73OMBCaZCzi' }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID || '1289410784257454' }}
          IG_USER_ID: ${{ secrets.IG_USER_ID || '17841427017671758' }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY || 'AIzaSyDpdDhoXt8GDwJ_sEj-vjtd6HqVflN_vSY' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN || 'TgAoAyRxipfYzSzSROuWF5GQcGD9rXnGE2_lshtduM3' }}
          BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID || '6aba9f05ea19ca0bde156163' }}
          VOICE: 'Puck'
          EVENT_MODE: ${{ github.event.inputs.mode || 'live_release' }}
        run: |
          ARGS=""
          MODE="${EVENT_MODE}"

          echo "Modo de Ejecucion Seleccionado: $MODE"

          if [ "$MODE" = "dry_run" ]; then
            ARGS="$ARGS --dry-run"
          elif [ "$MODE" = "draft_only" ]; then
            ARGS="$ARGS --publish --draft"
          elif [ "$MODE" = "live_release" ]; then
            ARGS="$ARGS --publish"
          elif [ "$MODE" = "render_only" ]; then
            echo "Modo Render Only: El video se renderizara y guardara como artefacto sin publicar en Meta."
          fi

          STORY_CHOICE="${{ github.event.inputs.story_id }}"
          if [ -z "$STORY_CHOICE" ] || [ "$STORY_CHOICE" = "autonomous_ai" ] || [ "$STORY_CHOICE" = "any" ]; then
            echo "Activando Motor de IA Autonomo para Guion e Imagenes Ultra-Virales..."
            ARGS="$ARGS --ai-story"
          else
            ARGS="$ARGS --story-id $STORY_CHOICE"
          fi

          python -m src.cloud_runner $ARGS

      - name: Persistir Ledger de Produccion (Cero Duplicados)
        if: success()
        run: |
          git config user.name "ComicLoreVault Engine"
          git config user.email "Lorecomicvault@users.noreply.github.com"
          git add published_ledger.json
          if [ -f output/videos_log.csv ]; then
            git add -f output/videos_log.csv 2>/dev/null || true
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore(ledger): registrar video producido para prevenir duplicados [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break || sleep 3
            done
          else
            echo "Ledger al dia. No hay nuevas entradas para commitear."
          fi

      - name: Subir Video Final como Artefacto (Descarga y Revision)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multiverso-comic-video-${{ github.run_number }}
          path: output/**/*.mp4
          if-no-files-found: ignore
          retention-days: 1

      - name: Archivar Logs de Produccion y Manifiesto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multiverso-comic-production-logs-${{ github.run_number }}
          path: |
            output/videos_log.csv
            output/**/*.ass
            output/**/script.json
            published_ledger.json
          if-no-files-found: ignore
          retention-days: 1
